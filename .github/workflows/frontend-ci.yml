name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check-scaffold:
    name: Check Frontend Scaffolded
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "scaffolded=true" >> $GITHUB_OUTPUT
          else
            echo "scaffolded=false" >> $GITHUB_OUTPUT
            echo "::notice::frontend/package.json not found — skipping frontend CI until William pushes the scaffold."
          fi

  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
